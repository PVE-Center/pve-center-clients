[package]
name = "pve-center-desktop"
version = "1.0.0"
description = "PVE Command Center desktop client for Windows and Linux"
authors = ["PVE Command Center Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/PVE-Center/pve-center-clients"

[lib]
name = "pve_center_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
