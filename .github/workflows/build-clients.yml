name: Build Clients (Web, Desktop & Android)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    name: Web SPA & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build Vite bundle
        run: npm run build
      - name: Upload Web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: pve-center-web-dist
          path: dist/

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            patchelf \
            xdg-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install npm dependencies
        run: npm ci
      - name: Build Tauri bundles (${{ matrix.bundles }})
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx tauri build --bundles ${{ matrix.bundles }}
          fi
      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pve-center-linux-packages
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.sig
      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pve-center-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig

  android:
    name: Android APK (Capacitor 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install npm dependencies
        run: npm ci
      - name: Build web assets and sync Capacitor Android
        run: |
          npm run build
          npx cap sync android
      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pve-center-android-apk
          path: android/app/build/outputs/apk/debug/*.apk

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find release-artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.msi' -o -name '*.apk' -o -name '*.sig' \) -exec mv -v {} release-assets/ \;
          find release-artifacts -mindepth 1 -type d -empty -delete
          tar -czf release-assets/pve-center-web-dist.tar.gz -C release-artifacts .
          python3 - "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone

          tag, repo = sys.argv[1], sys.argv[2]
          version = tag.lstrip("v")
          assets = os.listdir("release-assets")
          sigs = {name[:-4]: name for name in assets if name.endswith(".sig")}
          platforms = {}

          for binary_name, sig_name in sigs.items():
              with open(os.path.join("release-assets", sig_name), "r", encoding="utf-8") as f:
                  signature = f.read().strip()
              url = f"https://github.com/{repo}/releases/download/{tag}/{binary_name}"
              entry = {"signature": signature, "url": url}
              lower = binary_name.lower()
              if lower.endswith(".appimage"):
                  platforms["linux-x86_64"] = entry
              elif lower.endswith(".exe"):
                  platforms["windows-x86_64"] = entry
              elif lower.endswith(".msi") and "windows-x86_64" not in platforms:
                  platforms["windows-x86_64"] = entry

          if platforms:
              manifest = {
                  "version": version,
                  "notes": f"PVE Command Center {tag}",
                  "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "platforms": platforms,
              }
              with open("release-assets/latest.json", "w", encoding="utf-8") as f:
                  json.dump(manifest, f, indent=2)
                  f.write("\n")
          PY
          ls -lh release-assets/
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
